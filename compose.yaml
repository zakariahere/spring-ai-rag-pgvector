services:
  pgvector:
    # postgres 17 + the pgvector extension pre-built in
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: myrag
      POSTGRES_PASSWORD: myrag
      POSTGRES_DB: myrag
    ports:
      - "5432:5432"
    volumes:
      # Anything in this folder runs ONCE, the first time the data volume is created.
      # 01-enable-pgvector.sql turns on the `vector` extension for us.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      # Persist data across restarts. `docker compose down -v` wipes it.
      - pgdata:/var/lib/postgresql/data
    labels:
      # This label is the magic that makes Spring Boot's docker-compose support
      # treat this container as a Postgres "service connection" and wire the
      # datasource automatically. Without it, Boot wouldn't recognise the
      # pgvector/pgvector image (its name doesn't contain "postgres").
      org.springframework.boot.service-connection: postgres
    healthcheck:
      # Boot waits for `healthy` before connecting — which also means it waits
      # until the init SQL above has finished running.
      test: ["CMD-SHELL", "pg_isready -U myrag -d myrag"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The whole LGTM stack in ONE container: OpenTelemetry Collector + Loki (logs) +
  # Grafana (UI) + Tempo (traces) + Prometheus (metrics), pre-wired as datasources.
  # The app pushes OTLP to :4318; you read it all in Grafana at http://localhost:3000.
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"   # Grafana UI  (login admin / admin)
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP   <- the app exports here
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      # Persist dashboards + collected telemetry across restarts (the image writes to /data).
      - lgtmdata:/data

volumes:
  pgdata:
  lgtmdata:
