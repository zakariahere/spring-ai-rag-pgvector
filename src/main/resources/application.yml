spring:
  application:
    name: myrag

  # Load DEEPSEEK_API_KEY (and friends) from a local .env file when present.
  # optional: -> the app still boots without it.  [.properties] -> parse .env as key=value.
  config:
    import: "optional:file:.env[.properties]"

  # NOTE: no spring.datasource.* here on purpose.
  # spring-boot-docker-compose reads compose.yaml, starts the pgvector container,
  # and injects url/username/password from the service labelled "postgres".

  ai:
    # Two model providers share the classpath — name which one backs each model type,
    # or Spring AI won't know which ChatModel / EmbeddingModel to wire.
    model:
      chat: deepseek        # generation  -> DeepSeek (cloud)
      embedding: ollama     # embeddings  -> Ollama  (local, 768-d)

    deepseek:
      # Key comes from .env (DEEPSEEK_API_KEY). A non-empty dummy default lets the app
      # BOOT without a key (Phase 1 stays usable); /ask then fails gracefully at call time.
      api-key: ${DEEPSEEK_API_KEY:not-configured}
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.3    # low -> factual, grounded answers over creativity

    ollama:
      # Ollama on your EVO-X2 homelab. Override without touching code:
      #   $env:OLLAMA_BASE_URL='http://<evo-x2-ip>:11434'; mvn spring-boot:run
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

      init:
        # Auto-pull the embedding model if it isn't on the Ollama host yet.
        pull-model-strategy: when_missing
        embedding:
          include: true          # only the embedder runs locally now (chat = DeepSeek)

      embedding:
        model: nomic-embed-text  # 768-dimensional embeddings

    vectorstore:
      pgvector:
        # Create the vector_store table + index on startup if missing.
        # This became opt-in at Spring AI 1.0 GA (used to be automatic).
        initialize-schema: true
        # MUST match the embedding model's output size. nomic-embed-text = 768.
        # Mismatch here = every insert fails with a dimension error.
        dimensions: 768
        distance-type: cosine_distance
        index-type: hnsw
      # Log the chunks each similarity search returned (into the observation logs).
      observations:
        log-query-response: true   # DEV ONLY — carries your retrieved text

    # --- Observability: put the actual prompt into the ChatClient observation logs.
    # DEV ONLY: carries your augmented prompt + context, so keep this off in prod.
    chat:
      client:
        observations:
          log-prompt: true

# --- OpenTelemetry export -> the grafana/otel-lgtm container (OTLP HTTP on :4318) ---
management:
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 10s          # push metrics every 10s (snappy for a demo)
  tracing:
    sampling:
      probability: 1.0     # sample EVERY request in dev so no trace is missed
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    # Uncomment to watch the SQL / embedding calls fly by while learning:
    # org.springframework.ai.vectorstore: DEBUG
    org.springframework.ai: INFO

# Allow bigger uploads for PDFs
spring.servlet.multipart.max-file-size: 25MB
spring.servlet.multipart.max-request-size: 25MB

# --- RAG tuning knobs (the parameters worth experimenting with first) ---
myrag:
  chunk:
    size: 256        # target tokens per chunk. Smaller = more focused hits but
                     # more rows; larger = more context per hit but noisier.
    min-chars: 150   # don't emit a chunk shorter than this many characters
